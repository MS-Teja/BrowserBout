[project]
name = "browserbout"
version = "0.1.0"
description = "Automated, reproducible head-to-head browser benchmarks for macOS — Safari vs Vivaldi (and more)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Siva Teja Mutyala" }]
keywords = ["browser", "benchmark", "selenium", "safari", "vivaldi", "performance"]
dependencies = [
    "selenium>=4.25",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "psutil>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "types-psutil"]

[project.scripts]
bout = "browserbout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browserbout"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["selenium.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
