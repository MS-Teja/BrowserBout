name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Benchmarks run locally on real hardware; CI checks code quality only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy
      - run: pytest -q
